<!doctype html>
<!-- Summary figure (Figure 1) for a made-up result, drawn to show the parts working together.
     Idea: three heads chosen by attribution patching keep the model's answer when every other head is ablated;
     three random heads do not.
     Caption (goes under the image, not in it):
     **Three heads chosen by attribution patching are enough to keep the model's answer; three random heads are not.**
     On the prompt "When Mary and John went to the store, John gave a drink to", we keep three attention heads,
     mean-ablate every other head, and compare the model's probabilities for " Mary" and " John" with the full
     model's. Top: the three heads that attribution patching ranks highest keep " Mary" as the answer. Bottom: three
     heads drawn at random flip the answer to " John" (made-up result; the output bars are schematic).
     Render, from this folder: sh ../render_html.sh summary_example.html summary_example.png 1600 760 -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../summary.css">
<style>
  .canvas { height: 760px; padding: 32px 48px; display: grid; align-items: center; justify-items: center;
            grid-template-columns: 190px 260px 110px 260px 110px 380px 90px; grid-template-rows: 46px 108px 1fr 1fr;
            row-gap: 8px; column-gap: 0; }
  .row-label { justify-self: end; padding-right: 20px; width: auto; }
  .panel-head { white-space: nowrap; }
  .prompt { grid-column: 2 / 7; width: 900px; margin-top: 16px; }
  .out figcaption { white-space: nowrap; }
  .out .bar { width: 44px; }
  .ticks { display: flex; gap: 6px; padding: 0 4px; margin-top: 4px; }
  .ticks span { width: 44px; text-align: center; font-size: 16px; color: var(--muted); }
</style>
</head><body>
<div class="canvas">
  <div></div>
  <div class="panel-head">Choose three heads</div>
  <div></div>
  <div class="panel-head">Ablate every other head</div>
  <div></div>
  <div class="panel-head" style="grid-column: 6 / 8">Compare the answer</div>

  <div></div>
  <div class="chat prompt"><div class="user">When Mary and John went to the store, John gave a drink to</div><div class="assistant"><b class="ex">Mary</b></div></div>
  <div></div>

  <!-- Row 1: heads chosen by attribution patching form a connected circuit. -->
  <div class="row-label"><span class="stamp" data-icon="magnifier">attribution</span></div>
  <svg class="net" width="230" height="230" data-layers="3,5,4,2" data-on="1.1 2.2 3.0"></svg>
  <span class="arrow" data-icon="arrow"></span>
  <svg class="net" width="230" height="230" data-layers="3,5,4,2" data-on="1.1 2.2 3.0" data-ablate="1 2"></svg>
  <span class="arrow" data-icon="arrow"></span>
  <div class="out">
    <figure><div class="bars"><div class="bar target" style="height:74px"></div><div class="bar target" style="height:16px"></div></div>
      <div class="ticks"><span>Mary</span><span>John</span></div><figcaption>full model</figcaption></figure>
    <figure><div class="bars"><div class="bar on" style="height:68px"></div><div class="bar on" style="height:22px"></div></div>
      <div class="ticks"><span>Mary</span><span>John</span></div><figcaption>three heads</figcaption></figure>
  </div>
  <span class="badge check" data-icon="check"></span>

  <!-- Row 2: three random heads, not connected to one another. -->
  <div class="row-label"><span class="stamp light">random</span></div>
  <svg class="net" width="230" height="230" data-layers="3,5,4,2" data-on="1.0 1.4 3.1"></svg>
  <span class="arrow" data-icon="arrow"></span>
  <svg class="net" width="230" height="230" data-layers="3,5,4,2" data-on="1.0 1.4 3.1" data-ablate="1 2"></svg>
  <span class="arrow" data-icon="arrow"></span>
  <div class="out">
    <figure><div class="bars"><div class="bar target" style="height:74px"></div><div class="bar target" style="height:16px"></div></div>
      <div class="ticks"><span>Mary</span><span>John</span></div><figcaption>full model</figcaption></figure>
    <figure><div class="bars"><div class="bar on" style="height:20px"></div><div class="bar on" style="height:70px"></div></div>
      <div class="ticks"><span>Mary</span><span>John</span></div><figcaption>three heads</figcaption></figure>
  </div>
  <span class="badge cross" data-icon="cross"></span>
</div>
<script src="../summary.js"></script>
</body></html>
